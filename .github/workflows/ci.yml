name: MIRAGE Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

  type-check:
    name: Static Type Checking (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Mypy Strict
        run: |
          mypy --strict gateway hrs_engine correction_agent analytics mcp_server models shared workers benchmarks scripts tests/unit

  test-suite:
    name: Automated Unit & Benchmark Test Suite
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest with Coverage
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Run Offline Benchmark Sanity Check
        run: |
          python -m benchmarks.runner --benchmark mmhal --limit 2

  security-scan:
    name: Security Vulnerability Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Security Audit
        run: bandit -r gateway hrs_engine correction_agent shared workers -ll -ii

  frontend-test:
    name: React 18 / JSX Frontend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run Vitest Suite
        working-directory: dashboard
        run: npm test -- --run

  infra-validate:
    name: Validate Infrastructure & Compose Topologies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Verify Terraform Formatting
        run: terraform fmt -check -diff infra/terraform

      - name: Initialize Terraform (No Backend)
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Validate Terraform Configuration
        working-directory: infra/terraform
        run: terraform validate

      - name: Validate Local Compose Configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate Staging Compose Configuration
        run: docker compose -f docker-compose.yml -f docker-compose.staging.yml config --quiet

  docker-build:
    name: Validate Multi-Stage Docker Builds
    runs-on: ubuntu-latest
    needs: [test-suite, frontend-test, infra-validate]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.gateway
          push: false
          tags: mirage-gateway:test

      - name: Build Worker Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          tags: mirage-worker:test

      - name: Build Dashboard Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dashboard
          push: false
          tags: mirage-dashboard:test
