services:
  # ============================================================================
  # Relational Database: PostgreSQL 16 (Auditing, Row-Level Security, Tenancy)
  # ============================================================================
  postgres:
    image: postgres:16.4-alpine3.20
    container_name: mirage-postgres
    restart: unless-stopped
    networks:
      - backend_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mirage_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mirage_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mirage_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Document Store: MongoDB 7 (Verification Execution Traces & Raw Payloads)
  # ============================================================================
  mongodb:
    image: mongo:7.0.12
    container_name: mirage-mongodb
    restart: unless-stopped
    networks:
      - backend_net
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mirage_mongo_secret}
    volumes:
      - mongodata:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/01-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "root", "-p", "${MONGO_INITDB_ROOT_PASSWORD:-mirage_mongo_secret}", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Vector Database: Qdrant (Knowledge Base Embeddings & Retrieval)
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: mirage-qdrant
    restart: unless-stopped
    networks:
      - backend_net
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-mirage_qdrant_secret}
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # In-Memory Cache & Rate Limiter: Redis 7
  # ============================================================================
  redis:
    image: redis:7.2.5-alpine3.20
    container_name: mirage-redis
    restart: unless-stopped
    networks:
      - backend_net
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./docker/redis-users.acl:/usr/local/etc/redis/users.acl:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "mirage_app", "-a", "mirage_redis_secret", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Message Broker: RabbitMQ 3.13 (Celery Multi-Signal Pipeline Distribution)
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3.13.6-management-alpine
    container_name: mirage-rabbitmq
    restart: unless-stopped
    networks:
      - backend_net
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mirage}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-mirage_rabbit_secret}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      - ./docker/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Distributed Tracing Backend: Grafana Tempo
  # ============================================================================
  tempo:
    image: grafana/tempo:2.6.0
    container_name: mirage-tempo
    restart: unless-stopped
    networks:
      - observability_net
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # OpenTelemetry Collector: Telemetry Buffer & Router (TAD §10.1, Security §17.1)
  # ============================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: mirage-otel-collector
    restart: unless-stopped
    networks:
      - observability_net
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Metrics Scraper: Prometheus
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: mirage-prometheus
    restart: unless-stopped
    networks:
      - observability_net
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Operational Monitoring Dashboard: Grafana
  # ============================================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: mirage-grafana
    restart: unless-stopped
    networks:
      - observability_net
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-mirage_grafana_secret}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Database Migration: One-Shot Alembic Runner (TAD §10.1, ADR 0004)
  # ============================================================================
  migration:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: mirage-migration
    restart: "no"
    networks:
      - backend_net
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://mirage:${POSTGRES_PASSWORD:-mirage_dev_secret}@postgres:5432/mirage_db
      - DATABASE_SYNC_URL=postgresql://mirage:${POSTGRES_PASSWORD:-mirage_dev_secret}@postgres:5432/mirage_db
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # FastAPI Gateway: Ingestion, Proxying, Rate Limiting & Verification Orchestrator
  # ============================================================================
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: mirage-gateway
    restart: unless-stopped
    networks:
      - frontend_net
      - backend_net
      - observability_net
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://mirage:${POSTGRES_PASSWORD:-mirage_dev_secret}@postgres:5432/mirage_db
      - DATABASE_SYNC_URL=postgresql://mirage:${POSTGRES_PASSWORD:-mirage_dev_secret}@postgres:5432/mirage_db
      - MONGO_URI=mongodb://mirage_app:${MONGO_APP_PASSWORD:-mirage_mongo_secret}@mongodb:27017/mirage_traces?authSource=mirage_traces
      - MONGO_DB=mirage_traces
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=mirage_app
      - REDIS_PASSWORD=${REDIS_PASSWORD:-mirage_redis_secret}
      - REDIS_URL=redis://mirage_app:${REDIS_PASSWORD:-mirage_redis_secret}@redis:6379/0
      - CELERY_REDIS_USERNAME=mirage_celery
      - CELERY_REDIS_PASSWORD=${CELERY_REDIS_PASSWORD:-mirage_celery_secret}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=mirage
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-mirage_rabbit_secret}
      - CELERY_BROKER_URL=amqp://mirage:${RABBITMQ_PASSWORD:-mirage_rabbit_secret}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://mirage_celery:${CELERY_REDIS_PASSWORD:-mirage_celery_secret}@redis:6379/1
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-mirage_qdrant_secret}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Celery Worker Daemon: Multi-Queue Background Processor (ADR 0003, ADR 0004)
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: mirage-worker
    restart: unless-stopped
    networks:
      - backend_net
      - observability_net
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://mirage:${POSTGRES_PASSWORD:-mirage_dev_secret}@postgres:5432/mirage_db
      - DATABASE_SYNC_URL=postgresql://mirage:${POSTGRES_PASSWORD:-mirage_dev_secret}@postgres:5432/mirage_db
      - MONGO_URI=mongodb://mirage_app:${MONGO_APP_PASSWORD:-mirage_mongo_secret}@mongodb:27017/mirage_traces?authSource=mirage_traces
      - MONGO_DB=mirage_traces
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=mirage_app
      - REDIS_PASSWORD=${REDIS_PASSWORD:-mirage_redis_secret}
      - REDIS_URL=redis://mirage_app:${REDIS_PASSWORD:-mirage_redis_secret}@redis:6379/0
      - CELERY_REDIS_USERNAME=mirage_celery
      - CELERY_REDIS_PASSWORD=${CELERY_REDIS_PASSWORD:-mirage_celery_secret}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=mirage
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-mirage_rabbit_secret}
      - CELERY_BROKER_URL=amqp://mirage:${RABBITMQ_PASSWORD:-mirage_rabbit_secret}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://mirage_celery:${CELERY_REDIS_PASSWORD:-mirage_celery_secret}@redis:6379/1
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-mirage_qdrant_secret}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2560M
        reservations:
          cpus: "0.5"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # React 18 / Nginx Frontend: Real-Time Hallucination & Drift Dashboard
  # ============================================================================
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: mirage-dashboard
    restart: unless-stopped
    networks:
      - frontend_net
    ports:
      - "3000:8080"
    depends_on:
      gateway:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,size=32m
      - /var/run:rw,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  observability_net:
    driver: bridge

volumes:
  pgdata:
  mongodata:
  qdrant_storage:
  rabbitmqdata:
  tempodata:
  prometheusdata:
  grafanadata:
