groups:
  - name: mirage-execution-assurance
    rules:
      - alert: MirageGatewayDown
        expr: up{job="mirage-gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MIRAGE Gateway scrape target is down"
          description: "Prometheus cannot scrape /metrics from mirage-gateway for > 1m."

      - alert: MirageAuditChainIntegrityFailure
        expr: increase(mirage_audit_integrity_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Audit hash chain integrity check failed"
          description: "Snapshot PostgreSQL and anchor files immediately; investigate truncation or tampering."

      - alert: MirageVerificationLatencyDegraded
        expr: histogram_quantile(0.95, sum(rate(mirage_verification_duration_seconds_bucket[5m])) by (le)) > 2.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MIRAGE p95 verification latency exceeds 2.5s"
