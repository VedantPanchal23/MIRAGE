{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mirage.fullname" . }}-network-policy
  labels:
    {{- include "mirage.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mirage.name" . }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from ingress controller and internal components
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "mirage.name" . }}
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 3000
  egress:
    # Allow egress to DNS, Postgres, Redis, RabbitMQ, Qdrant
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
{{- end }}
