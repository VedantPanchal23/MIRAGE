{{- if not .Values.secrets.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mirage.fullname" . }}-secrets
  labels:
    {{- include "mirage.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  rabbitmq-password: {{ .Values.secrets.rabbitmqPassword | quote }}
  admin-api-key: {{ .Values.secrets.adminApiKey | quote }}
{{- end }}
