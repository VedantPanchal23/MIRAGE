[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirage"
version = "2.1.0"
description = "Autonomous Multimodal Hallucination Detection and Factual Consistency Verification System for Production LLMs"
readme = "README.md"
authors = [
    { name = "Vedant (23AIML042)", email = "vedantpanchal2309@gmail.com" },
    { name = "Dax (23AIML076)", email = "dax@iiitb.ac.in" }
]
license = { text = "Proprietary / Academic Research" }
requires-python = ">=3.11, <3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.3",
    "qdrant-client>=1.12.0",
    "redis>=5.1.0",
    "celery>=5.4.0",
    "kombu>=5.4.0",
    "pymongo>=4.10.0",
    "motor>=3.6.0",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "pybreaker>=1.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "lightgbm>=4.5.0",
    "shap>=0.46.0",
    "scikit-learn>=1.5.2",
    "numpy>=1.26.4",
    "scipy>=1.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "testcontainers>=4.8.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "schemathesis>=3.28.0",
    "types-redis>=4.6.0",
    "types-passlib>=1.7.7",
    "types-python-jose>=3.3.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "gateway*", "workers*", "models*", "hrs_engine*", "correction_agent*", "db*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests for pure logic without external dependencies",
    "model_unit: Model parsing and output validation tests",
    "integration: Integration tests with backing services",
    "contract: API contract tests against OpenAPI specification",
    "security: Security, RBAC, and tenant isolation tests",
    "adversarial: Adversarial robustness attack simulations (ATK-01 to ATK-04)",
]
addopts = "-v --strict-markers"
