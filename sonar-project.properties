# ==============================================================================
# SonarCloud / SonarQube Cloud Analysis Scope Configuration
# ==============================================================================
# Restricts scanned source code to production backend services, shared schemas,
# database models, and gateway. Keeps billable Lines of Code (LOC) at ~45,800,
# ensuring the project comfortably stays within SonarCloud's 100k free tier limit.
# ==============================================================================

# Production source directories to analyze
sonar.sources=gateway,services,shared,workers,hrs_engine,correction_agent,mcp_server,sdk,db

# Automated test directories (SonarCloud does NOT count test files towards billable LOC)
sonar.tests=tests

# File and directory exclusions (exclude docs, benchmarks, historical results, scripts, and assets)
sonar.exclusions=docs/**,benchmarks/**,results/**,scripts/**,data/**,infra/**,docker/**,k8s/**,dashboard/**,**/*.md,**/*.json,**/*.csv,**/*.txt,**/*.png,**/*.jpg,**/*.svg,**/*.sql

# Test file inclusions
sonar.test.inclusions=tests/**

# Code coverage exclusions (focus test coverage on production code)
sonar.coverage.exclusions=tests/**,docs/**,benchmarks/**,results/**,scripts/**,data/**,infra/**,docker/**,k8s/**,dashboard/**

# Source encoding and Python environment
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12, 3.13
